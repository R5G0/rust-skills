[workspace]
members = ["flat-tool", "feature-tool", "shared"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
layout-shared = { path = "shared", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
use_self = "warn"
redundant_clone = "warn"
or_fun_call = "warn"
