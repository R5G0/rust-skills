[package]
name = "cfg-check-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT"
description = "Positive configuration and negative diagnostic checks for unexpected_cfgs"

[workspace]

[features]
default = []
checked = []

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(validation_mode)'] }
