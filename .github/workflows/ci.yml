name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Validate & compile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Toolchain/target are pinned by checks/rust-toolchain.toml (Rust 1.97.1).
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            checks
            checks/fixtures/layouts
            checks/fixtures/proc-macros
            checks/fixtures/optimization
            perf-validation
      # The exact same command contributors run locally.
      - name: Run checks
        run: bash checks/check.sh

  performance-validation:
    name: Execute performance-rule experiments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: perf-validation
      # Correctness and benchmark execution only; shared runners do not gate speed.
      - name: Run native tests and benchmark smoke checks
        run: python3 perf-validation/scripts/verify.py
